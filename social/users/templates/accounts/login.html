{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<!-- Login -->
<div class="hero-log">
  <h1 class="text-center">Login</h1>
  <form method="POST" action="" class="text-center" autocomplete="on">
    {% csrf_token %}
    {{ login_form|crispy }}
    <button class="btn btn-warning" type="submit">Login</button>
    <p><b>Do you have an account? </b>
      <a class="nav-item nav-link" href="{% url 'register' %}">Register here</a>
    </p>
  </form>
</div>

{% endblock %}
